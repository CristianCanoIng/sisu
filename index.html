<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SISU - Acceso</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><link rel="stylesheet" href="./assets/css/app.css"></head><body class="login-page"><div class="login-shell"><section class="login-hero"><div class="login-logos"><img src="./assets/img/logosisu.png" alt="SISU"><img src="./assets/img/logouni.png" alt="Universidad"></div><h1>SISU</h1><p>Sistema Integral de Salud Universitaria. Accede a información médica, incapacidades, bienestar, SST, acompañamiento e inventario según tu rol.</p></section><section class="login-card"><h2>Iniciar sesión</h2><p>Usa tus credenciales institucionales.</p><div id="configWarning" class="alert alert-error hidden">Configura primero Supabase en <strong>assets/js/supabase.js</strong>.</div><div id="loginError" class="alert alert-error hidden"></div><form id="loginForm"><div class="form-group"><label>Correo</label><input id="correo" class="form-control" type="email" required autocomplete="username"></div><div class="form-group"><label>Contraseña</label><input id="password" class="form-control" type="password" required autocomplete="current-password"></div><div class="form-group"><label>Rol</label><input id="rolId" type="hidden"><div class="role-grid"><button type="button" class="role-option" data-role="1">Administrador</button><button type="button" class="role-option" data-role="2">Coordinador</button><button type="button" class="role-option" data-role="3">Estudiante</button><button type="button" class="role-option" data-role="4">Enfermero</button><button type="button" class="role-option" data-role="5">Docente</button><button type="button" class="role-option" data-role="7">Bienestar</button></div></div><button class="btn btn-primary" style="width:100%;padding:13px" type="submit"><i class="fas fa-sign-in-alt"></i> Ingresar</button></form></section></div><script type="module">import{initLogin}from'./assets/js/auth.js';initLogin()</script></body></html>
